.inl{display:flex;gap:8px;align-items:center}.inl input[type=file],.fld>input[type=file]{width:auto!important;flex:none;font-size:12px;border:0;padding:0}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:14px}.stats>div{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:14px 18px}

.prow{display:flex;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.prow:last-child{border:0}.prow .cimg{width:56px;height:56px}
.arow{padding:10px 0;border-bottom:1px solid var(--line);line-height:2}.arow:last-child{border:0}
footer{background:var(--card);margin-top:30px;padding:28px 14px 90px;box-shadow:0 -1px 0 var(--line)}
.fgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.fgrid>div{display:flex;flex-direction:column;gap:6px}.fgrid a:hover{color:var(--red)}
#toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:rgba(20,22,26,.92);color:#fff;padding:11px 22px;border-radius:999px;display:none;z-index:100;max-width:90vw;box-shadow:var(--shh);animation:toastin .2s ease}

 .quick{display:none}.hero{height:160px;border-radius:14px}.ht{font-size:20px}.grid{grid-template-columns:repeat(2,1fr);gap:10px}.crow{flex-wrap:wrap}.tks{grid-template-columns:1fr}
 .ff{grid-template-columns:1fr}.span2{grid-column:auto}.stats{grid-template-columns:repeat(2,1fr)}.prow{flex-wrap:wrap}.sortbar{flex-wrap:nowrap;overflow-x:auto}.sortbar>*{flex:none}.campbar{padding:12px 16px}

<script>
let sb, session, cart = JSON.parse(localStorage.getItem('hq_cart')||'[]'), products=[], quote=null;
const $=id=>document.getElementById(id), money=n=>'NT$'+Number(n).toLocaleString('zh-TW');
const esc=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toast=m=>{const t=$('toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2600)};
let pend=0;
const api=async(url,opt={})=>{pend++;$('prog').style.opacity=1;
 try{const r=await fetch(url,{...opt,headers:{'Content-Type':'application/json',...(session?{Authorization:'Bearer '+session.access_token}:{})},body:opt.body&&JSON.stringify(opt.body)});

async function loadCampaign(){try{CAMP=await api('/api/campaign');const a=CAMP.active,u=CAMP.upcoming,bs='background:#fff;color:var(--red);margin-top:8px';
 $('camp').innerHTML=a?`<div class="campbar"><b>${esc(a.name)}</b><span>${esc(a.banner_text||'')}</span><span>活動倒數:<span data-end="${a.ends_at}"></span></span><button onclick="show('campaign')" style="${bs}">前往活動專區</button> <button onclick="show('coupons')" style="${bs}">優惠券中心</button></div>`
 :u?`<div class="box mut" style="margin:8px 0 0">下一檔:${esc(u.name)},開始倒數 <span data-end="${u.starts_at}"></span> <button onclick="show('coupons')">優惠券中心</button></div>`
 :''}catch(e){}}
function showCampaign(){const a=CAMP&&CAMP.active;
 if(!a){$('campaign').innerHTML='<p class="mut">目前沒有進行中的活動</p>';return}
 const rules=[a.discount_percent?`全站 ${(100-a.discount_percent)/10} 折`:'',a.threshold_min?`滿 ${money(a.threshold_min)} 折 ${money(a.threshold_off)}`:'',a.free_ship_min?`滿 ${money(a.free_ship_min)} 免運`:'',a.allow_coupon?'可與優惠券併用':'不可與優惠券併用'].filter(Boolean);
 $('campaign').innerHTML=`<div class="box" style="background:var(--red);color:#fff"><h2 style="margin:0">${esc(a.name)}</h2>${esc(a.banner_text||'')}<br>倒數:<span data-end="${a.ends_at}"></span><br>${fmtDate(a.starts_at)} ~ ${fmtDate(a.ends_at)}</div>
 <div class="box"><b>活動優惠</b><br>${rules.map(esc).join('<br>')}<br><button onclick="show('coupons')">領取活動優惠券</button></div>
 ${a.content?`<div class="box" style="white-space:pre-wrap">${esc(a.content)}</div>`:''}
 ${(CAMP.featured||[]).length?`<h3>限時優惠商品</h3><div class="grid">${CAMP.featured.map(p=>card(p,true)).join('')}</div>`:''}<h3>熱銷排行榜</h3><div class="grid">${CAMP.top.map((p,i)=>card(p,true,i+1)).join('')||'<p class="mut">尚無商品</p>'}</div>`}

const ben=c=>c.type==='amount'?`折抵 ${money(c.value)}`:c.type==='percent'?`${(100-c.value)/10} 折`:'免運費';
const CF={coupons_avail:c=>['available','upcoming','soldout'].includes(c.status),coupons_claimed:c=>c.status==='claimed',coupons_soon:c=>c.soon,coupons_used:c=>c.status==='used',coupons_expired:c=>c.status==='expired'};
const CL={coupons_avail:'可領取',coupons_claimed:'已領取',coupons_soon:'即將到期',coupons_used:'已使用',coupons_expired:'已過期'};
async function loadCoupons(){try{CC=await api('/api/coupon-center');renderCoupons()}catch(e){toast(e.message)}}
function renderCoupons(){const list=CC.filter(CF[CTAB]);
 const act=c=>({available:`<button onclick="claim('${c.id}')">領取</button>`,claimed:`已領取 <button onclick="useCode('${c.code}')">去使用</button>`,used:'已使用',expired:'已過期',upcoming:'尚未開始',soldout:'已領完'}[c.status]);
 $('coupons').innerHTML=`<h3>優惠券中心</h3>${!session?'<p class="mut">登入後才能領取與查看自己的優惠券</p>':''}<div class="tabs">${Object.keys(CL).map(k=>`<button onclick="CTAB='${k}';renderCoupons()" style="${k===CTAB?'':'background:#888'}">${CL[k]}(${CC.filter(CF[k]).length})</button>`).join(' ')}</div>
 <div class="tks">${list.map(c=>`<div class="ticket ${c.status==='used'||c.status==='expired'?'off':''}"><div class="tl"><b>${ben(c)}</b><span>${c.min_spend?`低消 ${money(c.min_spend)}`:'無低消'}</span></div><div class="tr"><div>${esc(c.name)}</div><div class="mut">${fmtD(c.starts_at)} ~ ${fmtD(c.ends_at)}</div><div class="code">${esc(c.code)}</div></div><div class="ta">${act(c)}</div></div>`).join('')||'<p class="mut">這個分類目前沒有優惠券</p>'}</div>`}
async function claim(id){try{if(!session)throw new Error('請先登入');await api('/api/coupons/'+id+'/claim',{method:'POST'});toast('領取成功');loadCoupons()}catch(e){toast(e.message)}}
function useCode(code){appliedCode=code;$('code').value=code;show('cart')}

const AF={coupons:[['code','代碼'],['name','名稱'],['type','類型','select',['amount','percent','free_shipping']],['value','金額 / 折掉%','number'],['min_spend','最低消費','number'],['starts_at','開始(台灣時間)','dt'],['ends_at','結束(台灣時間)','dt'],['max_uses','使用上限','number'],['claim_limit','發放數量','number'],['claim_required','需先領取','bool'],['active','啟用','bool']],
 campaigns:[['name','名稱'],['starts_at','開始(台灣時間)','dt'],['ends_at','結束(台灣時間)','dt'],['discount_percent','全站折掉%','number'],['threshold_min','滿額門檻','number'],['threshold_off','滿額折抵','number'],['free_ship_min','免運門檻','number'],['allow_coupon','可併用優惠券','bool'],['banner_text','Banner 文字'],['content','活動內容'],['active','啟用','bool']]};
function afField(r,[k,label,t,opts]){const id=`af_${r.id||'new'}_${k}`,v=r[k];
 const inner=t==='bool'?`<input type="checkbox" id="${id}" ${(v===undefined?['active','allow_coupon'].includes(k):v)?'checked':''}>`
 :t==='select'?`<select id="${id}">${opts.map(o=>`<option ${o===v?'selected':''}>${o}</option>`).join('')}</select>`
 :`<input id="${id}" type="${t==='dt'?'datetime-local':t==='number'?'number':'text'}" value="${esc(t==='dt'&&v?toLocal(v):v??'')}" style="width:${t==='number'?100:150}px">`;
 return `<label class="fld">${label}${inner}</label>`}
async function loadAdmin(k){AK=k||AK;if(!AF[AK])return loadAdminView();try{const rows=await api('/api/admin/'+AK);
 $('admin').innerHTML=`<h3>後台管理</h3><div class="tabs">${adminTabs()}</div>
 <p class="mut">時間請填台灣時間。type 選 free_shipping 就是免運券;percent 填「折掉幾 %」(10 = 9 折)。</p>
 ${[{},...rows].map(r=>`<div class="panel"><b>${r.id?esc(r.name||r.title):'新增'}</b><div class="ff4">${AF[AK].map(f=>afField(r,f)).join('')}</div><button onclick="adminSave('${r.id||''}')">${r.id?'儲存':'建立'}</button> ${r.id?`<button onclick="adminDel('${r.id}')" style="background:#888">刪除</button>`:''}${AK==='campaigns'&&r.id?` <button class="btn-o" onclick="campProducts('${r.id}')">活動商品</button><div id="cp_${r.id}"></div>`:''}</div>`).join('')}`}catch(e){$('admin').innerHTML='';toast(e.message)}}
async function adminSave(id){try{const body={};AF[AK].forEach(([k,,t])=>{const el=$(`af_${id||'new'}_${k}`);body[k]=t==='bool'?el.checked:t==='dt'?(el.value?new Date(el.value+':00+08:00').toISOString():null):el.value});
 await api('/api/admin/'+AK+(id?'/'+id:''),{method:id?'PUT':'POST',body});toast(id?'已儲存':'已建立');loadAdmin();loadCampaign()}catch(e){toast(e.message)}}
async function adminDel(id){if(!confirm('確定刪除?'))return;try{await api('/api/admin/'+AK+'/'+id,{method:'DELETE'});toast('已刪除');loadAdmin()}catch(e){toast(e.message)}}
AF.announcements=[['title','標題'],['body','內容'],['active','啟用','bool']];
AF.banners=[['title','標題'],['image_url','圖片網址'],['sort_order','排序','number'],['active','啟用','bool']];
AF.product_categories=[['name','分類名稱']];
const ADMIN_TABS=[['coupons','優惠券/免運券'],['campaigns','節慶活動'],['announcements','公告'],['banners','Banner'],['product_categories','商品分類'],['members','會員'],['merchants','商家'],['aproducts','商品'],['areviews','評論']];
const adminTabs=()=>ADMIN_TABS.map(([k,l])=>`<button onclick="loadAdmin('${k}')" style="${AK===k?'':'background:#888'}">${l}</button>`).join(' ');
const AMAP={members:'members',merchants:'merchants',aproducts:'products',areviews:'reviews'};
async function loadAdminView(){try{const r=await api('/api/admin/'+AMAP[AK]),D=t=>new Date(t).toLocaleDateString('zh-TW',{timeZone:'Asia/Taipei'});let b='';
 if(AK==='members')b=r.map(m=>`<div class="arow">${esc(m.username)}・${esc(m.email)}・${D(m.created_at)} <select onchange="adminRole('${m.id}',this.value)">${['member','merchant','admin'].map(x=>`<option ${x===m.role?'selected':''}>${x}</option>`).join('')}</select></div>`).join('');
 if(AK==='merchants')b=r.map(m=>`<div class="arow"><b>${esc(m.name)}</b>・${esc(m.profiles&&m.profiles.username||'')}・${esc(m.contact||'')}・${m.suspended?'<b class="price">已停權</b>':'營業中'} <button onclick="adminSuspend('${m.id}',${!m.suspended})" style="background:#888">${m.suspended?'解除停權':'停權(商品全部下架)'}</button></div>`).join('');
 if(AK==='aproducts')b=r.map(p=>`<div class="arow">${esc(p.name)}・${esc(p.merchants&&p.merchants.name||'Hi-Qi 自營')}・${money(p.price)}・庫存 ${p.stock}・已售 ${p.sold}・${p.status==='active'?'上架中':'已下架'} <button onclick="adminProd('${p.id}','${p.status==='active'?'hidden':'active'}')" style="background:#888">${p.status==='active'?'下架':'重新上架'}</button></div>`).join('');
 if(AK==='areviews')b=r.map(v=>`<div class="arow">${esc(v.product||'')}・${esc(v.username)}・<span class="price">${stars(v.rating)}</span><button onclick="adminRev('${v.id}')" style="float:right;background:#888">刪除</button><br>${esc(v.content)}</div>`).join('');
 $('admin').innerHTML=`<h3>後台管理</h3><div class="tabs">${adminTabs()}</div><div class="panel">${b||'<p class="mut">沒有資料</p>'}</div>`}catch(e){$('admin').innerHTML='';toast(e.message)}}
async function adminRole(id,role){try{await api('/api/admin/members/'+id+'/role',{method:'PUT',body:{role}});toast('已更新身分')}catch(e){toast(e.message);loadAdmin()}}
async function adminSuspend(id,f){try{await api('/api/admin/merchants/'+id+'/suspend',{method:'PUT',body:{suspended:f}});toast(f?'已停權並下架該商家商品':'已解除停權');loadAdmin()}catch(e){toast(e.message)}}
async function adminProd(id,status){try{await api('/api/admin/products/'+id+'/status',{method:'PUT',body:{status}});toast('已更新');loadAdmin();load()}catch(e){toast(e.message)}}
async function adminRev(id){if(!confirm('確定刪除這則評論?'))return;try{await api('/api/admin/reviews/'+id,{method:'DELETE'});toast('已刪除');loadAdmin()}catch(e){toast(e.message)}}

let SITE={banners:[],announcements:[]},bi=0;
async function loadSite(){try{SITE=await api('/api/site');bi=0;drawSite()}catch(e){}}
function drawSite(){const n=SITE.banners.length,b=n?SITE.banners[bi%n]:null;
 $('site').innerHTML=`<div class="hero" style="${b&&b.image_url?`background-image:url('${esc(b.image_url)}')`:''}"><div class="hin"><div class="ht">${esc(b?b.title:'Hi-Qi 購物商城')}</div><div class="hs">${b?'':'商品、優惠、活動一次看'}</div></div>${n>1?`<div class="dots">${SITE.banners.map((_,i)=>`<i class="${i===bi%n?'on':''}"></i>`).join('')}</div>`:''}</div>
 <div class="quick"><a onclick="show('coupons')"><i>券</i><div><b>優惠券中心</b><span>領券再下單更划算</span></div></a><a onclick="show('campaign')"><i>慶</i><div><b>購物節活動</b><span>限時優惠專區</span></div></a><a onclick="show('merchant')"><i>店</i><div><b>商家入駐</b><span>開店賣商品</span></div></a><a onclick="show('orders')"><i>單</i><div><b>我的訂單</b><span>查看出貨與到貨</span></div></a></div>
 ${SITE.announcements.length?`<div class="annc"><span class="atag">公告</span>${SITE.announcements.map(a=>esc(a.title)).join('　・　')}</div>`:''}`}
setInterval(()=>{if(SITE.banners.length>1){bi++;drawSite()}},5000);
function upImg(inp,target){const f=inp.files[0];if(!f)return;const fr=new FileReader();
 fr.onload=()=>{const im=new Image();im.onerror=()=>toast('無法讀取這張圖片');
  im.onload=async()=>{const k=Math.min(1,1000/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);
   try{const u=await api('/api/upload',{method:'POST',body:{dataUrl:c.toDataURL('image/jpeg',.85)}});$(target).value=(target==='pim'&&$(target).value?$(target).value+'\n':'')+u.url;toast('圖片上傳完成')}catch(e){toast(e.message)}};
  im.src=fr.result};fr.readAsDataURL(f)}
const gal=p=>[...new Set([p.image_url,...[...(p.product_images||[])].sort((a,b)=>a.sort_order-b.sort_order).map(x=>x.url)].filter(Boolean))];
function gsel(el){$('gmain').style.backgroundImage='url("'+el.dataset.u.replace(/"/g,'%22')+'")'}
const card=(p,only,rank)=>{const pp=p.promo&&!p.promo.soldout?p.promo:null,price=pp?pp.price:p.price,was=pp?p.price:p.original_price;
 const tag=pp?`-${pp.percent}%`:(p.original_price&&p.original_price>p.price?`-${Math.round((1-p.price/p.original_price)*100)}%`:'');
 return `<div class="card"><a class="img" onclick="detail('${p.id}')" style="background-image:url('${esc(p.image_url||'')}')">${tag?`<span class="tag">${tag}</span>`:''}${rank?`<span class="rank">TOP ${rank}</span>`:(pp?`<span class="rank">活動價</span>`:'')}${p.stock?'':'<span class="soldout">已售完</span>'}</a>
 <div class="cb"><div class="nm" onclick="detail('${p.id}')">${esc(p.name)}</div><div class="pr"><span class="cur">NT$</span><b>${Number(price).toLocaleString('zh-TW')}</b>${was?`<s>${money(was)}</s>`:''}</div>
 <div class="meta"><span>${pp&&pp.left!=null?`限量剩 ${pp.left} 件`:p.merchants!==undefined?esc((p.merchants&&p.merchants.name)||'Hi-Qi 自營'):''}</span><span>${p.rating_count?`★ ${p.rating_avg}・`:''}${p.sold!=null?'已售 '+p.sold:''}</span></div>
 <div class="acts">${only||p.has_variants?`<button class="${p.has_variants||only?'btn-o':''}" onclick="detail('${p.id}')">${p.has_variants?'選擇規格':'查看商品'}</button>`:p.stock?`<button class="btn-o" onclick="add('${p.id}')">加入購物車</button><button onclick="buyNow({product_id:'${p.id}',variant_id:null,qty:1})">立即購買</button>`:`<button disabled>已售完</button>`}</div></div></div>`};
function pickCat(id,el){$('fc').value=id;document.querySelectorAll('#catnav a').forEach(a=>a.classList.toggle('on',a===el));show('shop');load()}
function setSort(v,el){$('fs').value=v;document.querySelectorAll('#chips button').forEach(b=>b.classList.toggle('on',b===el));load()}
drawSite();
async function campProducts(cid){const box=$('cp_'+cid);try{const [list,all]=await Promise.all([api(`/api/admin/campaigns/${cid}/products`),api('/api/admin/products')]);
 box.innerHTML=`<div style="margin-top:14px;border-top:1px solid var(--line);padding-top:10px"><b>活動商品(專屬折扣 / 限量)</b>
 ${list.map(x=>`<div class="arow">${esc(x.name)}・折掉 ${x.discount_percent}%・${x.limit_qty!=null?`限量 ${x.limit_qty}(已售 ${x.sold_count})`:'不限量'} <button class="lnk" onclick="cpDel('${cid}','${x.product_id}')">移除</button></div>`).join('')||'<p class="mut">尚未加入活動商品</p>'}
 <div class="ff4"><label class="fld">商品<select id="cps_${cid}">${all.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></label><label class="fld">折掉 %<input id="cpd_${cid}" type="number" min="1" max="90" value="10"></label><label class="fld">活動價限量(空白=不限)<input id="cpl_${cid}" type="number" min="1"></label></div>
 <button onclick="cpAdd('${cid}')">加入 / 更新活動商品</button></div>`}catch(e){toast(e.message)}}
async function cpAdd(cid){try{await api(`/api/admin/campaigns/${cid}/products`,{method:'POST',body:{product_id:$('cps_'+cid).value,discount_percent:$('cpd_'+cid).value,limit_qty:$('cpl_'+cid).value}});toast('已更新活動商品');campProducts(cid)}catch(e){toast(e.message)}}
async function cpDel(cid,pid){try{await api(`/api/admin/campaigns/${cid}/products/${pid}`,{method:'DELETE'});toast('已移除');campProducts(cid)}catch(e){toast(e.message)}}
const skel=n=>Array.from({length:n},()=>'<div class="card sk"><div class="img"></div><div class="cb"><div class="l1"></div><div class="l2"></div></div></div>').join('');
const ROUTES=['shop','cart','orders','merchant','favs','coupons','campaign','admin','authBox'];
function route(){const t=decodeURIComponent(location.hash.slice(1))||'shop';
 if(t!=='checkout'&&direct)direct=null;
 if(t==='checkout'){if(!direct)return show('cart');return render('cart')}
 if(t.startsWith('product/'))return loadDetail(t.slice(8));
 render(ROUTES.includes(t)?t:'shop')}
const show=s=>{if((location.hash.slice(1)||'shop')===s)route();else location.hash=s==='shop'?'':s};
window.addEventListener('hashchange',route);
let dtm;const inShop=()=>(location.hash.slice(1)||'shop')==='shop';
function searchGo(){if(!inShop())show('shop');load()}
function debLoad(){clearTimeout(dtm);dtm=setTimeout(searchGo,350)}
init();route();
</script></body></html>
